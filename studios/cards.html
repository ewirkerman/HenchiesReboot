<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henchies 2 - Card Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">
  
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none max-w-md w-full px-4 items-center"></div>

  <main-nav active-page="card_studio" subtitle="Card Studio"></main-nav>

  <main class="flex-1 max-w-[1600px] w-full mx-auto p-4 flex flex-col md:flex-row gap-6">
    <!-- Catalog (Left) -->
    <div class="w-full md:w-80 flex flex-col gap-4">
      <studio-catalog id="card-catalog" title="Card Catalog"></studio-catalog>
      
      <!-- JSON Preview Container -->
      <div id="json-preview-container" class="hidden md:block"></div>
    </div>

    <!-- Editor (Center/Right) -->
    <div class="flex-1 flex flex-col gap-4">
      <div class="glass-panel rounded-2xl p-5 shadow-2xl border border-slate-800 flex flex-col xl:flex-row gap-6">
        <!-- Form -->
        <div class="flex-1 flex flex-col gap-4">
          <div class="flex justify-between items-end border-b border-slate-800 pb-2">
            <h2 class="text-lg font-black text-amber-400 uppercase tracking-wider" id="form-title">⚡ Design Card</h2>
            <studio-topbar id="studio-topbar"></studio-topbar>
          </div>

          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="col-span-2">
              <label class="font-bold text-slate-300 block mb-1">Name</label>
              <input type="text" id="card-name" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" />
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Tribe</label>
              <select id="card-tribe" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none">
                <!-- Dynamically populated -->
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Type</label>
              <select id="card-type" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none">
                <option value="unit">Unit</option>
                <option value="avatar">Avatar</option>
                <option value="equipment">Equipment</option>
                <option value="artifact">Artifact</option>
                <option value="spell">Spell</option>
                <option value="boon">Boon</option>
              </select>
            </div>
            <div id="default-line-container">
              <label class="font-bold text-slate-300 block mb-1">Default Line</label>
              <select id="card-default-line" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none">
                <option value="mid">Mid (Standard)</option>
                <option value="front">Front</option>
                <option value="back">Back</option>
                <option value="sheltered">Sheltered</option>
                <option value="sideline">Sideline</option>
                <option value="taunt">Taunt</option>
                <option value="bodyguard">Bodyguard</option>
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Genus / Subtype</label>
              <select id="card-genus" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none">
                <option value="">None</option>
              </select>
            </div>
            <div id="family-container">
              <label class="font-bold text-slate-300 block mb-1">Family</label>
              <select id="card-family" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none">
                <option value="">-- Select Family --</option>
                <option value="Humanoid">Humanoid</option>
                <option value="Creature">Creature</option>
                <option value="Automaton">Automaton</option>
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Cost (Resource / Tents)</label>
              <input type="number" id="card-cost" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" value="1" min="0" />
            </div>
            <div id="stat-power-container">
              <label class="font-bold text-slate-300 block mb-1">Power</label>
              <input type="number" id="card-power" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" value="0" min="0" />
            </div>
            <div id="stat-health-container">
              <label class="font-bold text-slate-300 block mb-1">Health (Max)</label>
              <input type="number" id="card-health" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" value="1" min="1" />
            </div>
            <div id="stat-strength-container">
              <label class="font-bold text-slate-300 block mb-1">Strength (Damage)</label>
              <input type="number" id="card-strength" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" placeholder="Empty = None" min="0" />
            </div>
            <div class="col-span-2">
              <label class="font-bold text-slate-300 block mb-1">Art URL</label>
              <input type="text" id="card-art" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" placeholder="https://..." />
            </div>
            <div class="col-span-2 grid grid-cols-2 gap-4 bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
              <div>
                <label class="font-bold text-slate-400 block mb-1 text-[10px] uppercase tracking-wider flex justify-between"><span>Art Pan X (Horizontal)</span><span class="text-amber-500/50 italic">Or drag image</span></label>
                <input type="range" id="card-art-x" min="0" max="100" value="50" class="w-full accent-amber-500" />
              </div>
              <div>
                <label class="font-bold text-slate-400 block mb-1 text-[10px] uppercase tracking-wider">Art Pan Y (Vertical)</label>
                <input type="range" id="card-art-y" min="0" max="100" value="50" class="w-full accent-amber-500" />
              </div>
            </div>
            <div class="col-span-2">
              <label class="font-bold text-slate-300 block mb-1">Flavor Text / Manual Description</label>
              <textarea id="card-description" rows="2" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none"></textarea>
            </div>
          </div>
          
          <div class="mt-2 border-t border-slate-800 pt-3 flex flex-col gap-2">
            <div class="flex justify-between items-center mb-1">
                <h3 class="text-xs font-bold text-indigo-400">⚡ Assigned Abilities</h3>
                <button type="button" onclick="window.createNewAbilityForCard()" id="create-new-ability-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[9px] font-bold px-2 py-1 rounded shadow transition">+ New Ability</button>
            </div>
            <div id="assigned-abilities" class="flex flex-col gap-2"></div>
            
            <input type="text" list="ability-options" id="add-ability-input" placeholder="+ Type to search abilities..." class="bg-slate-900 border border-indigo-500/50 p-2 rounded text-indigo-300 text-xs w-full mt-1 outline-none focus:border-indigo-400 placeholder-indigo-500/50" />
            <datalist id="ability-options"></datalist>
          </div>

          <div id="referenced-abilities-container" class="hidden mt-2 border-t border-slate-800 pt-3 flex flex-col gap-2">
            <div class="flex justify-between items-center mb-1">
                <h3 class="text-xs font-bold text-sky-400">🔗 Referenced Abilities</h3>
                <span class="text-[9px] text-slate-500 italic">Auto-detected dependencies</span>
            </div>
            <div id="referenced-abilities-list" class="flex flex-col gap-2"></div>
          </div>

          <button id="save-card-btn" class="mt-4 bg-amber-500 hover:bg-amber-400 text-black font-extrabold p-3 rounded-xl shadow-xl transition text-sm uppercase tracking-wider">💾 Save Card</button>
        </div>

        <!-- Preview -->
        <div class="w-full xl:w-[400px] flex flex-col items-center gap-4 bg-slate-900/50 rounded-xl p-6 border border-slate-800">
          <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest border-b border-slate-800 w-full text-center pb-2">Live Preview</h3>
          <div id="card-preview-container" class="w-full flex flex-col items-center"></div>
        </div>
      </div>
    </div>
  </main>
  
  <script type="module">
    import { CARD_CATALOG } from '../src/engine.js';
    import { renderCardHTML, showToast, openInspectionModal, renderJSONPreview, loadUI } from '../src/ui.js';
    import { fetchCustomAbilities, fetchCustomCards, saveCardToCatalog, deleteCardFromCatalog, createGameRoom, saveAbilityToCatalog, fetchCustomTribes } from '../src/firebase.js';
    import { generateAbilityDescription } from '../src/language_description.js';
    import { launchSandboxMatch } from '../src/testing.js';
    import '../components/main_nav.js';
    import '../components/catalog.js'; 
    import '../components/topbar.js';

    let allCards = [];
    let allAbilities = [];
    let allAbilitiesRegistry = [];
    let customTribes = [];
    let currentEditingId = null;
    let currentAbilities = []; 
    let draggedAbilityIndex = null;

    window.inspectCard = (cardJson) => {
      openInspectionModal(JSON.parse(decodeURIComponent(cardJson)), allAbilitiesRegistry);
    };

    window.createNewAbilityForCard = async () => {
        const card = buildCardState();
        if (!card.name || card.name.trim() === 'Unnamed Card') {
            showToast('Please name the card before creating an ability.', 'error');
            return;
        }
        
        const btn = document.getElementById('create-new-ability-btn');
        btn.innerHTML = 'Saving...';
        btn.disabled = true;

        await saveCardToCatalog(card);
        window.location.href = `abilities.html`;
    };

    init();

    async function init() {
      await loadUI();
      
      customTribes = await fetchCustomTribes();
      const tribeSelect = document.getElementById('card-tribe');
      if (customTribes.length > 0) {
          tribeSelect.innerHTML = customTribes.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      } else {
          tribeSelect.innerHTML = `<option value="Generic">Generic</option>`;
      }

      window.populateGenuses = (tribeId, currentGenus = '') => {
          const genusSelect = document.getElementById('card-genus');
          let optionsHtml = '<option value="">None</option>';
          const tribe = customTribes.find(t => t.id === tribeId || t.name === tribeId);
          if (tribe && tribe.validGenuses && tribe.validGenuses.length > 0) {
              tribe.validGenuses.forEach(g => {
                  optionsHtml += `<option value="${g}">${g}</option>`;
              });
          }
          genusSelect.innerHTML = optionsHtml;
          if (currentGenus && genusSelect.querySelector(`option[value="${currentGenus}"]`)) {
              genusSelect.value = currentGenus;
          } else {
              genusSelect.value = '';
          }
      };

      tribeSelect.addEventListener('change', (e) => window.populateGenuses(e.target.value));

      const fetchedCards = await fetchCustomCards();
      const rawAbilities = await fetchCustomAbilities();
      
      const tempCards = [...CARD_CATALOG, ...fetchedCards];
      allAbilities = rawAbilities.map(ab => ({ ...ab, displayDescription: generateAbilityDescription(ab, rawAbilities, tempCards) }));
      allAbilitiesRegistry = [...allAbilities];
      
      const defaultAttackAbility = {
        "abilityId": "ability_1785516184176",
        "name": "Attack",
        "description": "",
        "trigger": "MANUAL",
        "additionalTriggers": [],
        "triggerScope": "PERSONAL",
        "triggerLimit": "UNLIMITED",
        "cost": { "tribeAmount": 0, "carnie": 0, "readinessCost": "UNREADIES", "reuseIgnoresReadiness": false, "freeAction": false },
        "activation": { "method": "PLAYER_CHOICE", "quickTargeting": { "zones": ["FIELD"], "alignment": ["ENEMY"], "entityType": ["UNIT", "AVATAR"], "ignoreBattlelines": false }, "logicTree": { "type": "group", "children": [], "logicalOperator": "AND" } },
        "effects": [{ "targetCount": 1, "quickTargeting": { "entityType": ["UNIT", "AVATAR"], "zones": ["FIELD"], "alignment": ["ENEMY"], "ignoreBattlelines": false }, "payloads": [{ "amount": 1, "duration": "INSTANT", "type": "ATTACK" }], "logicTree": { "type": "group", "logicalOperator": "AND", "children": [] }, "targetMethod": "SAME_AS_ACTIVATION" }]
      };
      
      if (!allAbilities.some(a => a.abilityId === defaultAttackAbility.abilityId)) {
          const processedAtt = { ...defaultAttackAbility, displayDescription: generateAbilityDescription(defaultAttackAbility, allAbilities, tempCards) };
          allAbilities.push(processedAtt);
          allAbilitiesRegistry.push(processedAtt);
      }

      const hydratedCustomCards = fetchedCards.map(c => {
          if (c.abilities) {
              c.abilities = c.abilities.map(ab => {
                  const abId = typeof ab === 'string' ? ab : ab.abilityId;
                  const match = rawAbilities.find(a => a.abilityId === abId);
                  return match ? JSON.parse(JSON.stringify(match)) : null;
              }).filter(Boolean);
          }
          return c;
      });
      allCards = [...CARD_CATALOG, ...hydratedCustomCards];

      const abilityDatalist = document.getElementById('ability-options');
      allAbilities.forEach(ab => {
          const opt = document.createElement('option');
          opt.value = ab.name;
          abilityDatalist.appendChild(opt);
      });

      const inputs = document.querySelectorAll('input:not(#add-ability-input):not(#catalog-search), select, textarea');
      inputs.forEach(el => {
          el.addEventListener('input', updatePreview);
          el.addEventListener('change', updatePreview);
      });

      const previewContainer = document.getElementById('card-preview-container');
      let isDraggingArt = false;
      let startMouseX, startMouseY, startArtX, startArtY;

      previewContainer.addEventListener('mousedown', (e) => {
          if (!e.target.closest('.group') || !document.getElementById('card-art').value) return;
          isDraggingArt = true;
          startMouseX = e.clientX;
          startMouseY = e.clientY;
          startArtX = parseInt(document.getElementById('card-art-x').value) || 50;
          startArtY = parseInt(document.getElementById('card-art-y').value) || 50;
          previewContainer.style.cursor = 'grabbing';
      });

      window.addEventListener('mousemove', (e) => {
          if (!isDraggingArt) return;
          const deltaX = (e.clientX - startMouseX) * -0.5;
          const deltaY = (e.clientY - startMouseY) * -0.5;
          
          document.getElementById('card-art-x').value = Math.max(0, Math.min(100, startArtX + deltaX));
          document.getElementById('card-art-y').value = Math.max(0, Math.min(100, startArtY + deltaY));
          updatePreview();
      });

      window.addEventListener('mouseup', () => { isDraggingArt = false; previewContainer.style.cursor = 'grab'; });
      window.addEventListener('mouseleave', () => { isDraggingArt = false; previewContainer.style.cursor = 'grab'; });

      document.getElementById('card-type').addEventListener('change', toggleStatFields);
      
      const addAbilityInput = document.getElementById('add-ability-input');
      addAbilityInput.addEventListener('change', (e) => {
          const val = e.target.value.toLowerCase();
          const match = allAbilities.find(a => a.name.toLowerCase() === val);
          
          if (match) {
              if (!currentAbilities.includes(match.abilityId)) {
                  currentAbilities.push(match.abilityId);
                  renderAssignedAbilities();
                  updatePreview();
              }
              e.target.value = '';
              e.target.blur(); 
          }
      });

      const catalogEl = document.getElementById('card-catalog');
      catalogEl.addEventListener('new-item', resetForm);

      document.getElementById('save-card-btn').addEventListener('click', saveCard);
      
      const topbar = document.getElementById('studio-topbar');
      topbar.addEventListener('save', saveCard);
      topbar.addEventListener('clone', cloneCard);
      topbar.addEventListener('test', () => { if(window.launchTestMatch) window.launchTestMatch(); });
      topbar.addEventListener('delete', deleteCard);
      topbar.addEventListener('import', async (e) => {
          const data = e.detail;
          data.id = 'card_' + Date.now();
          
          if (data.abilities && Array.isArray(data.abilities)) {
              for (const ab of data.abilities) {
                  if (typeof ab === 'object' && ab.abilityId) {
                      if (!allAbilities.some(a => a.abilityId === ab.abilityId)) {
                          let newDesc = '';
                          try { newDesc = generateAbilityDescription(ab, allAbilities, allCards); } catch(err) {}
                          ab.displayDescription = newDesc;
                          allAbilities.push(ab);
                          allAbilitiesRegistry.push(ab);
                          await saveAbilityToCatalog(ab);
                      }
                  }
              }
          }

          allCards.unshift(data);
          window.loadCard(data.id);
          document.getElementById('card-name').value += ' (Imported)';
          updatePreview();
          renderCatalog();
          
          showToast('Card Imported Successfully!', 'success');
      });

      const urlParams = new URLSearchParams(window.location.search);
      const hashId = window.location.hash.replace('#', '');
      const loadId = urlParams.get('id') || hashId;

      renderCatalog();
      resetForm();

      if (loadId) {
          setTimeout(() => window.loadCard(loadId), 50);
      }

      window.addEventListener('hashchange', () => {
          const newHash = window.location.hash.replace('#', '');
          if (newHash && newHash !== currentEditingId) {
              window.loadCard(newHash);
          } else if (!newHash && currentEditingId) {
              resetForm();
          }
      });
    }

    function toggleStatFields() {
        const type = document.getElementById('card-type').value;
        const hpContainer = document.getElementById('stat-health-container');
        const strContainer = document.getElementById('stat-strength-container');
        const lineContainer = document.getElementById('default-line-container');
        const familyContainer = document.getElementById('family-container');
        
        if (type === 'unit' || type === 'avatar') {
            hpContainer.classList.remove('hidden');
            strContainer.classList.remove('hidden');
        } else {
            hpContainer.classList.add('hidden');
            strContainer.classList.add('hidden');
        }

        if (type === 'unit') {
            lineContainer.classList.remove('hidden');
            familyContainer.classList.remove('hidden');
        } else {
            lineContainer.classList.add('hidden');
            familyContainer.classList.add('hidden');
            document.getElementById('card-family').value = '';
        }

        if (type === 'equipment') {
            const attachAb = allAbilities.find(a => a.name.toLowerCase() === 'attach to a unit' || a.name.toLowerCase() === 'attach');
            if (attachAb && !currentAbilities.includes(attachAb.abilityId)) {
                currentAbilities.push(attachAb.abilityId);
                renderAssignedAbilities();
                updatePreview();
            }
        }
    }

    function renderAssignedAbilities() {
        const container = document.getElementById('assigned-abilities');
        if (currentAbilities.length === 0) {
            container.innerHTML = `<span class="text-xs text-slate-500 italic">No abilities assigned.</span>`;
            renderReferencedAbilities();
            return;
        }

        container.innerHTML = currentAbilities.map((abId, index) => {
            const ab = allAbilities.find(a => a.abilityId === abId);
            if (!ab) return '';
            return `
                <div draggable="true" 
                     ondragstart="window.handleDragStart(event, ${index})"
                     ondragover="window.handleDragOver(event)"
                     ondrop="window.handleDrop(event, ${index})"
                     ondragend="window.handleDragEnd(event)"
                     class="flex justify-between items-center bg-indigo-950/40 hover:bg-indigo-900/60 border border-indigo-900 p-2 rounded text-xs cursor-move transition-colors">
                    <div class="pointer-events-none flex items-center gap-2">
                        <span class="text-indigo-500/50 text-[10px]">☰</span>
                        <span class="font-bold text-indigo-300">${ab.name}</span>
                        <span class="text-[9px] bg-indigo-900 text-indigo-200 px-1 py-0.5 rounded ml-1">${ab.trigger || 'MANUAL'}</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="window.copyAbilityJSON('${ab.abilityId}')" title="Copy JSON" class="text-slate-500 hover:text-amber-400 transition p-1">📋</button>
                        <a href="abilities.html#${ab.abilityId}" onclick="event.stopPropagation()" title="Open Ability in Studio" class="text-indigo-400 hover:text-indigo-200 transition p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" /></svg>
                        </a>
                        <button onclick="window.removeAbility(${index})" class="text-red-400 hover:text-red-300 font-black px-1.5">&times;</button>
                    </div>
                </div>
            `;
        }).join('');
        
        renderReferencedAbilities();
    }

    function renderReferencedAbilities() {
        const container = document.getElementById('referenced-abilities-container');
        const listContainer = document.getElementById('referenced-abilities-list');
        
        const dependentAbilityIds = new Set();
        const queue = [...currentAbilities];
        const processed = new Set();

        while (queue.length > 0) {
            const currentId = queue.shift();
            if (processed.has(currentId)) continue;
            processed.add(currentId);
            
            const ab = allAbilitiesRegistry.find(a => a.abilityId === currentId);
            if (!ab) continue;

            const text = (ab.displayDescription || '') + ' ' + (ab.description || '');
            const mentionRegex = /@\[(.*?)\]/g;
            let match;
            while ((match = mentionRegex.exec(text)) !== null) {
                const matchedName = match[1];
                const found = allAbilitiesRegistry.find(a => a.name.toLowerCase() === matchedName.toLowerCase());
                if (found && !currentAbilities.includes(found.abilityId)) {
                    dependentAbilityIds.add(found.abilityId);
                    queue.push(found.abilityId);
                }
            }

            if (ab.effects) {
                ab.effects.forEach(g => {
                    if (g.payloads) {
                        g.payloads.forEach(p => {
                            if (p.type === 'GRANT_ABILITY' || p.type === 'REMOVE_ABILITY') {
                                if (p.grantedAbilityId && !currentAbilities.includes(p.grantedAbilityId)) {
                                    dependentAbilityIds.add(p.grantedAbilityId);
                                    queue.push(p.grantedAbilityId);
                                }
                            }
                            if (p.nestedGroup && p.nestedGroup.payloads) {
                                p.nestedGroup.payloads.forEach(np => {
                                    if (np.type === 'GRANT_ABILITY' || np.type === 'REMOVE_ABILITY') {
                                        if (np.grantedAbilityId && !currentAbilities.includes(np.grantedAbilityId)) {
                                            dependentAbilityIds.add(np.grantedAbilityId);
                                            queue.push(np.grantedAbilityId);
                                        }
                                    }
                                });
                            }
                        });
                    }
                });
            }
        }

        if (dependentAbilityIds.size === 0) {
            container.classList.add('hidden');
            return;
        }

        container.classList.remove('hidden');
        listContainer.innerHTML = Array.from(dependentAbilityIds).map(abId => {
            const ab = allAbilitiesRegistry.find(a => a.abilityId === abId);
            if (!ab) return '';
            return `
                <div class="flex justify-between items-center bg-slate-900/60 border border-slate-700/50 p-2 rounded text-xs transition-colors group">
                    <div class="pointer-events-none flex items-center gap-2">
                        <span class="font-bold text-sky-300">${ab.name}</span>
                        <span class="text-[9px] bg-slate-950 text-slate-400 px-1 py-0.5 rounded ml-1">${ab.trigger || 'MANUAL'}</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <button onclick="window.copyAbilityJSON('${ab.abilityId}')" title="Copy JSON" class="text-slate-500 hover:text-amber-400 transition p-1">📋</button>
                        <a href="abilities.html#${ab.abilityId}" onclick="event.stopPropagation()" title="Open Ability in Studio" class="text-slate-500 hover:text-sky-300 transition p-1 group-hover:text-sky-400">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" /></svg>
                        </a>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.removeAbility = (index) => {
        currentAbilities.splice(index, 1);
        renderAssignedAbilities();
        updatePreview();
    };

    window.copyAbilityJSON = (abilityId) => {
        const ab = allAbilitiesRegistry.find(a => a.abilityId === abilityId);
        if (ab) {
            navigator.clipboard.writeText(JSON.stringify(ab, null, 2)).then(() => {
                showToast('Ability JSON Copied!', 'success');
            });
        }
    };

    window.handleDragStart = (e, index) => {
        draggedAbilityIndex = index;
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => e.target.classList.add('opacity-50'), 0);
    };

    window.handleDragOver = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    };

    window.handleDrop = (e, targetIndex) => {
        e.preventDefault();
        if (draggedAbilityIndex === null || draggedAbilityIndex === targetIndex) return;
        const draggedItem = currentAbilities.splice(draggedAbilityIndex, 1)[0];
        currentAbilities.splice(targetIndex, 0, draggedItem);
        renderAssignedAbilities();
        updatePreview();
    };

    window.handleDragEnd = (e) => {
        draggedAbilityIndex = null;
        e.target.classList.remove('opacity-50');
        renderAssignedAbilities();
    };

    function resetForm() {
        currentEditingId = null;
        window.location.hash = '';
        document.getElementById('form-title').innerText = '⚡ Design New Card';
        document.getElementById('card-name').value = '';
        if (customTribes.length > 0) document.getElementById('card-tribe').value = customTribes[0].id;
        document.getElementById('card-type').value = 'unit';
        document.getElementById('card-default-line').value = 'mid';
        window.populateGenuses(document.getElementById('card-tribe').value, '');
        document.getElementById('card-family').value = '';
        document.getElementById('card-cost').value = '1';
        document.getElementById('card-power').value = '0';
        document.getElementById('card-health').value = '1';
        document.getElementById('card-strength').value = '';
        document.getElementById('card-art').value = '';
        document.getElementById('card-art-x').value = '50';
        document.getElementById('card-art-y').value = '50';
        document.getElementById('card-description').value = '';
        
        currentAbilities = [];
        
        document.getElementById('studio-topbar').showButtons(false);
        
        toggleStatFields();
        renderAssignedAbilities();
        updatePreview();
    }

    function buildCardState() {
        const strVal = document.getElementById('card-strength').value;
        const cardType = document.getElementById('card-type').value;
        
        const state = {
            id: currentEditingId || ('card_' + Date.now()),
            updatedAt: Date.now(),
            name: document.getElementById('card-name').value || 'Unnamed Card',
            tribe: document.getElementById('card-tribe').value,
            type: cardType,
            genus: document.getElementById('card-genus').value || '',
            family: cardType === 'unit' ? (document.getElementById('card-family').value || '') : '',
            cost: parseInt(document.getElementById('card-cost').value) || 0,
            power: parseInt(document.getElementById('card-power').value) || 0,
            health: parseInt(document.getElementById('card-health').value) || 1,
            maxHealth: parseInt(document.getElementById('card-health').value) || 1,
            strength: strVal === '' ? null : parseInt(strVal),
            description: document.getElementById('card-description').value || '',
            artUrl: document.getElementById('card-art').value || '',
            artX: parseInt(document.getElementById('card-art-x').value) || 50,
            artY: parseInt(document.getElementById('card-art-y').value) || 50,
            abilities: (currentAbilities || []).map(id => allAbilities.find(a => a.abilityId === id)).filter(Boolean)
        };
        
        const attackIdx = state.abilities.findIndex(a => a.name.toLowerCase() === 'attack' || a.abilityId === 'ability_1785516184176');
        if (attackIdx > 0) {
            const attackAb = state.abilities.splice(attackIdx, 1)[0];
            state.abilities.unshift(attackAb);
        }

        if (cardType === 'unit') {
            state.defaultLine = document.getElementById('card-default-line').value;
        }
        
        return state;
    }

    window.copyCardJSON = () => {
        const card = buildCardState();
        navigator.clipboard.writeText(JSON.stringify(card, null, 2)).then(() => {
            showToast('Card JSON Copied!', 'success');
        });
    };

    window.inspectMiniPreview = () => {
        const card = buildCardState();
        openInspectionModal(card, allAbilitiesRegistry);
    };

    function updatePreview() {
        const strVal = document.getElementById('card-strength').value;
        const cardType = document.getElementById('card-type').value;
        const atkId = 'ability_1785516184176';
        
        if ((cardType === 'unit' || cardType === 'avatar') && strVal !== '') {
            if (!currentAbilities.includes(atkId)) {
                currentAbilities.push(atkId);
                renderAssignedAbilities();
            }
        } else {
            const idx = currentAbilities.indexOf(atkId);
            if (idx > -1) {
                currentAbilities.splice(idx, 1);
                renderAssignedAbilities();
            }
        }

        const card = buildCardState();
        const container = document.getElementById('card-preview-container');
        
        container.innerHTML = `<card-preview card-data="${encodeURIComponent(JSON.stringify(card)).replace(/'/g, "%27")}"></card-preview>`;
        
        renderJSONPreview('json-preview-container', card, 'copyCardJSON');
    }

    async function saveCard() {
        const card = buildCardState();
        if (!card.name || card.name.trim() === 'Unnamed Card') {
            showToast('Please provide a name for the card.', 'error');
            return;
        }
        if (card.type === 'unit' && !card.family) {
            showToast('Units must have a Family assigned.', 'error');
            return;
        }

        const btn = document.getElementById('save-card-btn');
        const origText = btn.innerHTML;
        btn.innerHTML = 'Saving...';
        btn.disabled = true;
        
        const topbar = document.getElementById('studio-topbar');
        if (topbar && topbar.setLoading) topbar.setLoading('save', true);

        const cloudSaveSuccess = await saveCardToCatalog(card);
        
        allCards = [...allCards.filter(c => c.id !== card.id), card];
        currentEditingId = card.id;
        
        document.getElementById('form-title').innerText = `⚡ Edit: ${card.name}`;
        document.getElementById('studio-topbar').showButtons(true);

        btn.innerHTML = origText;
        btn.disabled = false;
        
        if (topbar && topbar.setLoading) topbar.setLoading('save', false);

        if (cloudSaveSuccess) {
            showToast(`Card '${card.name}' saved successfully!`, 'success');
        } else {
            showToast(`⚠️ Cloud save failed! Card '${card.name}' saved locally.`, 'error');
        }
        renderCatalog();
    }

    function cloneCard() {
        if (!currentEditingId) return;
        currentEditingId = null;
        document.getElementById('form-title').innerText = `⚡ Design New Card (Cloned)`;
        document.getElementById('card-name').value += ' (Copy)';
        document.getElementById('studio-topbar').showButtons(false);
        updatePreview();
        showToast('Card cloned! Save to keep it.', 'info');
    }

    async function deleteCard() {
        if (!currentEditingId) return;
        await deleteCardFromCatalog(currentEditingId);
        allCards = allCards.filter(c => c.id !== currentEditingId);
        showToast('Card deleted.', 'success');
        resetForm();
        renderCatalog();
    }

    window.launchTestMatch = async () => {
        const card = buildCardState();
        const topbar = document.getElementById('studio-topbar');
        if (topbar && topbar.setLoading) topbar.setLoading('test', true);

        await launchSandboxMatch(card, 'card');
        
        if (topbar && topbar.setLoading) topbar.setLoading('test', false);
    };

    function renderCatalog() {
        const catalogEl = document.getElementById('card-catalog');
        if (!catalogEl) return;
        
        catalogEl.setItems(allCards, (c) => {
            const matchedTribe = customTribes.find(t => t.id === c.tribe || t.name === c.tribe);
            const tribeName = matchedTribe ? matchedTribe.name : c.tribe;
            return `
            <div onclick="window.loadCard('${c.id}')" class="p-2 bg-slate-900 border border-slate-800 hover:border-amber-500 rounded-xl text-xs flex justify-between items-center cursor-pointer transition">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded bg-amber-500 text-black font-extrabold flex items-center justify-center text-[10px]">${c.cost || 0}</span>
                    <div class="flex flex-col">
                        <span class="font-bold text-amber-300">${c.name}</span>
                        <span class="text-[9px] text-slate-400 capitalize">${tribeName} • ${c.type}</span>
                    </div>
                </div>
                ${c.abilities && c.abilities.length > 0 ? `<span class="text-[9px] bg-indigo-950 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-900">${c.abilities.length} Abil</span>` : ''}
            </div>
            `;
        });
    }

    window.loadCard = (id) => {
        const card = allCards.find(c => c.id === id);
        if (!card) return;

        currentEditingId = card.id;
        window.location.hash = id;
        document.getElementById('form-title').innerText = `⚡ Edit: ${card.name}`;
        document.getElementById('card-name').value = card.name;
        
        let mappedTribe = card.tribe || 'Generic';
        if (!mappedTribe.startsWith('tribe_')) {
            const match = customTribes.find(t => t.name.toLowerCase() === mappedTribe.toLowerCase());
            if (match) mappedTribe = match.id;
        }
        document.getElementById('card-tribe').value = mappedTribe;
        window.populateGenuses(mappedTribe, card.genus || '');

        document.getElementById('card-type').value = card.type || 'unit';
        document.getElementById('card-default-line').value = card.defaultLine || 'mid';
        document.getElementById('card-genus').value = card.genus || '';
        document.getElementById('card-family').value = card.family || '';
        document.getElementById('card-cost').value = card.cost || 0;
        document.getElementById('card-power').value = card.power || 0;
        document.getElementById('card-health').value = card.maxHealth || card.health || 1;
        document.getElementById('card-strength').value = (card.strength !== undefined && card.strength !== null) ? card.strength : '';
        document.getElementById('card-art').value = card.artUrl || '';
        document.getElementById('card-art-x').value = card.artX ?? 50;
        document.getElementById('card-art-y').value = card.artY ?? 50;
        document.getElementById('card-description').value = card.description || '';
        
        currentAbilities = (card.abilities || []).map(a => a.abilityId || a);
        
        document.getElementById('studio-topbar').showButtons(true);
        
        toggleStatFields();
        renderAssignedAbilities();
        updatePreview();
    };
  </script>
</body>
</html>
