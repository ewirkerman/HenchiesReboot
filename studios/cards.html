<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>Henchies 2 - Card Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">
  
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none max-w-md w-full px-4 items-center"></div>

  <main-nav active-page="card_studio" subtitle="Card Studio"></main-nav>

  <main class="flex-1 max-w-[1600px] w-full mx-auto p-4 flex flex-col md:flex-row gap-6">
    <!-- Catalog (Left) -->
    <div class="w-full md:w-80 flex flex-col gap-4">
      <studio-catalog id="card-catalog" title="Card Catalog"></studio-catalog>
      
      <!-- JSON Preview Container -->
      <div id="json-preview-container" class="hidden md:block"></div>
    </div>

    <!-- Editor (Center/Right) -->
    <div class="flex-1 flex flex-col gap-4">
      <div class="glass-panel rounded-2xl p-5 shadow-2xl border border-slate-800 flex flex-col xl:flex-row gap-6">
        <!-- Form -->
        <div class="flex-1 flex flex-col gap-4">
          <div class="flex justify-between items-end border-b border-slate-800 pb-2">
            <h2 class="text-lg font-black text-amber-400 uppercase tracking-wider" id="form-title">⚡ Design Card</h2>
            <studio-topbar id="studio-topbar"></studio-topbar>
          </div>

          <div class="flex flex-col gap-3 text-xs mt-2">
            <!-- Block 1: Identity & Taxonomy -->
            <div class="flex flex-col gap-2 p-3 bg-slate-900/50 rounded-xl border border-slate-700/50">
              <h3 class="text-[10px] font-black text-white uppercase tracking-widest border-b border-slate-800 pb-1 mb-1">1. Identity & Taxonomy</h3>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <div class="col-span-2">
                  <label class="font-bold text-slate-300 block mb-1">Name</label>
                  <input type="text" id="card-name" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none" />
                </div>
                <div>
                  <label class="font-bold text-slate-300 block mb-1">Tribe</label>
                  <select id="card-tribe" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none"></select>
                </div>
                <div>
                  <label class="font-bold text-slate-300 block mb-1">Type</label>
                  <select id="card-type" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none">
                    <option value="unit">Unit</option>
                    <option value="avatar">Avatar</option>
                    <option value="equipment">Equipment</option>
                    <option value="artifact">Artifact</option>
                    <option value="spell">Spell</option>
                    <option value="boon">Boon</option>
                  </select>
                </div>
                
                <div id="stat-line-container" class="col-span-2 transition-all duration-300">
                  <label class="font-bold text-slate-300 block mb-1">Default Line</label>
                  <select id="card-default-line" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none">
                    <option value="mid">Mid (Standard)</option>
                    <option value="front">Front</option>
                    <option value="back">Back</option>
                    <option value="sheltered">Sheltered</option>
                    <option value="sideline">Sideline</option>
                    <option value="taunt">Taunt</option>
                    <option value="bodyguard">Bodyguard</option>
              </select>
            </div>
                <div id="stat-genus-container" class="transition-all duration-300">
                  <label class="font-bold text-slate-300 block mb-1">Genus / Subtype</label>
                  <select id="card-genus" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none">
                    <option value="">None</option>
                  </select>
                </div>
                <div id="stat-family-container" class="transition-all duration-300">
                  <label class="font-bold text-slate-300 block mb-1">Family</label>
                  <select id="card-family" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none">
                    <option value="">None</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Block 2: Stats & Combat -->
            <div class="flex flex-col gap-2 p-3 bg-rose-950/20 rounded-xl border border-rose-900/40">
              <h3 class="text-[10px] font-black text-rose-400 uppercase tracking-widest border-b border-rose-900/50 pb-1 mb-1">2. Stats & Combat</h3>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                <div id="stat-cost-container" class="transition-all duration-300">
                  <label class="font-bold text-slate-300 block mb-1">Cost (Res/Tents)</label>
                  <input type="number" id="card-cost" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none" value="1" min="0" />
                </div>
                <div id="stat-power-container" class="transition-all duration-300">
                  <label class="font-bold text-slate-300 block mb-1">Power</label>
                  <input type="number" id="card-power" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none" value="0" min="0" />
                </div>
                <div id="stat-strength-container" class="transition-all duration-300">
                  <label class="font-bold text-slate-300 block mb-1">Strength (Damage)</label>
                  <input type="number" id="card-strength" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none" placeholder="Empty = None" min="0" />
                </div>
                <div id="stat-health-container" class="transition-all duration-300">
                  <label class="font-bold text-slate-300 block mb-1">Health (Max)</label>
                  <input type="number" id="card-health" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none" value="1" min="1" />
                </div>
              </div>
            </div>

            <!-- Block 3: Presentation -->
            <div class="flex flex-col gap-2 p-3 bg-emerald-950/20 rounded-xl border border-emerald-900/40">
              <h3 class="text-[10px] font-black text-emerald-400 uppercase tracking-widest border-b border-emerald-900/50 pb-1 mb-1">3. Presentation</h3>
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-2.5">
                <div class="sm:col-span-2">
                  <label class="font-bold text-slate-300 block mb-1">Art URL</label>
                  <input type="text" id="card-art" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none" placeholder="https://..." />
                </div>
                <div class="sm:col-span-4 grid grid-cols-1 sm:grid-cols-3 gap-3 w-full">
                  <art-panner title="Standard Frame" prefix="card-art" default-scale="100"></art-panner>
                  <art-panner title="Micro Frame" prefix="card-micro-art" default-scale="125"></art-panner>
                  <art-panner title="Nano Frame" prefix="card-nano-art" default-scale="110"></art-panner>
                </div>
                <div class="sm:col-span-4 mt-2">
                  <label class="font-bold text-slate-300 block mb-1">Flavor Text / Manual Description</label>
                  <textarea id="card-description" rows="2" class="bg-slate-900 border border-slate-700 px-2 py-1.5 rounded text-white w-full focus:border-amber-500 outline-none custom-scrollbar"></textarea>
                </div>
              </div>
            </div>
          </div>
          
          <div class="mt-2 border-t border-slate-800 pt-3 flex flex-col gap-2">
            <div class="flex justify-between items-center mb-1">
                <h3 class="text-xs font-bold text-indigo-400">⚡ Assigned Abilities</h3>
                <button type="button" onclick="window.createNewAbilityForCard()" id="create-new-ability-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-[9px] font-bold px-2 py-1 rounded shadow transition">+ New Ability</button>
            </div>
            <div id="assigned-abilities" class="flex flex-col gap-2"></div>
            
            <input type="text" list="ability-options" id="add-ability-input" placeholder="+ Type to search abilities..." class="bg-slate-900 border border-indigo-500/50 p-2 rounded text-indigo-300 text-xs w-full mt-1 outline-none focus:border-indigo-400 placeholder-indigo-500/50" />
            <datalist id="ability-options"></datalist>
          </div>

          <div id="referenced-abilities-container" class="hidden mt-2 border-t border-slate-800 pt-3 flex flex-col gap-2">
            <div class="flex justify-between items-center mb-1">
                <h3 class="text-xs font-bold text-sky-400">🔗 Referenced Abilities</h3>
                <span class="text-[9px] text-slate-500 italic">Auto-detected dependencies</span>
            </div>
            <div id="referenced-abilities-list" class="flex flex-col gap-2"></div>
          </div>

          <button id="save-card-btn" class="mt-4 bg-amber-500 hover:bg-amber-400 text-black font-extrabold p-3 rounded-xl shadow-xl transition text-sm uppercase tracking-wider">💾 Save Card</button>
        </div>

        <!-- Preview -->
        <div class="w-full xl:w-[400px] flex flex-col items-center gap-4 bg-slate-900/50 rounded-xl p-6 border border-slate-800">
          <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest border-b border-slate-800 w-full text-center pb-2">Live Preview</h3>
          <div id="card-preview-container" class="w-full flex flex-col items-center"></div>
        </div>
      </div>
    </div>
  </main>
  
  <script type="module" src="../src/studio/card/card_controller.js"></script>
</body>
</html>
