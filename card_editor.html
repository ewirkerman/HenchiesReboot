<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henchies 2 - Card Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">
  
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none max-w-md w-full px-4 items-center"></div>

  <header class="sticky top-0 z-40 glass-panel border-b border-slate-800 px-4 py-3 flex flex-wrap justify-between items-center gap-2 shadow-2xl">
    <div class="flex items-center gap-3">
      <span class="text-xl font-black bg-gradient-to-r from-amber-400 via-yellow-500 to-amber-600 bg-clip-text text-transparent">HENCHIES 2</span>
      <span class="text-xs px-2 py-0.5 rounded-full bg-slate-800 border border-slate-700 text-amber-300 font-semibold">Card Studio</span>
    </div>
    <nav class="flex items-center gap-3 text-xs font-semibold">
      <a href="game.html" class="text-slate-400 hover:text-slate-200">Game Table</a>
      <a href="deckbuilder.html" class="text-slate-400 hover:text-slate-200">Deckbuilder</a>
      <a href="card_editor.html" class="text-amber-400 border-b-2 border-amber-400 pb-0.5">Card Studio</a>
      <a href="ability_editor.html" class="text-slate-400 hover:text-slate-200">Ability Studio</a>
    </nav>
  </header>

  <main class="flex-1 max-w-[1600px] w-full mx-auto p-4 flex flex-col md:flex-row gap-6">
    <!-- Catalog (Left) -->
    <div class="w-full md:w-80 flex flex-col gap-4">
      <studio-catalog id="card-catalog" title="Card Catalog"></studio-catalog>
      
      <!-- JSON Preview Container -->
      <div id="json-preview-container" class="hidden md:block"></div>
    </div>

    <!-- Editor (Center/Right) -->
    <div class="flex-1 flex flex-col gap-4">
      <div class="glass-panel rounded-2xl p-5 shadow-2xl border border-slate-800 flex flex-col xl:flex-row gap-6">
        <!-- Form -->
        <div class="flex-1 flex flex-col gap-4">
          <div class="flex justify-between items-end border-b border-slate-800 pb-2">
            <h2 class="text-lg font-black text-amber-400 uppercase tracking-wider" id="form-title">⚡ Design Card</h2>
            <studio-topbar id="studio-topbar"></studio-topbar>
          </div>

          <div class="grid grid-cols-2 gap-3 text-xs">
            <div class="col-span-2">
              <label class="font-bold text-slate-300 block mb-1">Name</label>
              <input type="text" id="card-name" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" />
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Tribe</label>
              <select id="card-tribe" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none">
                <option value="Robot">Robot</option>
                <option value="Mythic">Mythic</option>
                <option value="Elemental">Elemental</option>
                <option value="Pirate">Pirate</option>
                <option value="Undead">Undead</option>
                <option value="Carnie">Carnie</option>
                <option value="Viking">Viking</option>
                <option value="Ninja">Ninja</option>
                <option value="Stalker">Stalker</option>
                <option value="Alien">Alien</option>
                <option value="Luchador">Luchador</option>
                <option value="Generic">Generic (Neutral)</option>
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Type</label>
              <select id="card-type" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none">
                <option value="unit">Unit</option>
                <option value="avatar">Avatar</option>
                <option value="equipment">Equipment</option>
                <option value="spell">Spell</option>
              </select>
            </div>
            <div id="default-line-container">
              <label class="font-bold text-slate-300 block mb-1">Default Line</label>
              <select id="card-default-line" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none">
                <option value="mid">Mid (Standard)</option>
                <option value="front">Front</option>
                <option value="back">Back</option>
                <option value="sheltered">Sheltered</option>
                <option value="sideline">Sideline</option>
                <option value="taunt">Taunt</option>
                <option value="bodyguard">Bodyguard</option>
              </select>
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Genus / Subtype</label>
              <input type="text" id="card-genus" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" placeholder="e.g. Melee, Ranged, Relic" />
            </div>
            <div>
              <label class="font-bold text-slate-300 block mb-1">Cost (Resource / Tents)</label>
              <input type="number" id="card-cost" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" value="1" min="0" />
            </div>
            <div id="stat-health-container">
              <label class="font-bold text-slate-300 block mb-1">Health (Max)</label>
              <input type="number" id="card-health" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" value="1" min="1" />
            </div>
            <div id="stat-strength-container">
              <label class="font-bold text-slate-300 block mb-1">Strength (Damage)</label>
              <input type="number" id="card-strength" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" placeholder="Empty = None" min="0" />
            </div>
            <div class="col-span-2">
              <label class="font-bold text-slate-300 block mb-1">Art URL</label>
              <input type="text" id="card-art" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none" placeholder="https://..." />
            </div>
            <div class="col-span-2">
              <label class="font-bold text-slate-300 block mb-1">Flavor Text / Manual Description</label>
              <textarea id="card-description" rows="2" class="bg-slate-900 border border-slate-700 p-2 rounded text-white w-full focus:border-amber-500 outline-none"></textarea>
            </div>
          </div>
          
          <div class="mt-2 border-t border-slate-800 pt-3 flex flex-col gap-2">
            <h3 class="text-xs font-bold text-indigo-400">⚡ Assigned Abilities</h3>
            <div id="assigned-abilities" class="flex flex-col gap-2"></div>
            
            <!-- Upgraded Searchable Datalist Input -->
            <input type="text" list="ability-options" id="add-ability-input" placeholder="+ Type to search abilities..." class="bg-slate-900 border border-indigo-500/50 p-2 rounded text-indigo-300 text-xs w-full mt-1 outline-none focus:border-indigo-400 placeholder-indigo-500/50" />
            <datalist id="ability-options"></datalist>
          </div>

          <button id="save-card-btn" class="mt-4 bg-amber-500 hover:bg-amber-400 text-black font-extrabold p-3 rounded-xl shadow-xl transition text-sm uppercase tracking-wider">💾 Save Card</button>
        </div>

        <!-- Preview -->
        <div class="w-full xl:w-[400px] flex flex-col items-center gap-4 bg-slate-900/50 rounded-xl p-6 border border-slate-800">
          <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest border-b border-slate-800 w-full text-center pb-2">Live Preview</h3>
          <div id="card-preview-container" class="transform scale-125 origin-top mt-4 mb-16"></div>
        </div>
      </div>
    </div>
  </main>
  
  <script type="module">
    import { CARD_CATALOG } from './src/engine.js';
    import { renderCardHTML, showToast, openInspectionModal, renderJSONPreview } from './src/ui.js';
    import { fetchCustomAbilities, fetchCustomCards, saveCardToCatalog, deleteCardFromCatalog, createGameRoom } from './src/firebase.js';
    import { generateAbilityDescription } from './src/language_description.js';
    import { launchSandboxMatch } from './src/testing.js';
    import './src/catalog_component.js'; 
    import './src/studio_topbar.js';

    let allCards = [];
    let allAbilities = [];
    let currentEditingId = null;
    let currentAbilities = []; // Stores abilityIds attached to the current card
    let draggedAbilityIndex = null;

    init();

    async function init() {
      // 1. Fetch dependencies
      const customCards = await fetchCustomCards();
      const rawAbilities = await fetchCustomAbilities();
      
      const tempCards = [...CARD_CATALOG, ...customCards];
      allAbilities = rawAbilities.map(ab => ({ ...ab, displayDescription: generateAbilityDescription(ab, rawAbilities, tempCards) }));
      
      const hydratedCustomCards = customCards.map(c => {
          if (c.abilities) {
              c.abilities = c.abilities.map(ab => {
                  const abId = typeof ab === 'string' ? ab : ab.abilityId;
                  const match = rawAbilities.find(a => a.abilityId === abId);
                  return match ? JSON.parse(JSON.stringify(match)) : null;
              }).filter(Boolean);
          }
          return c;
      });
      allCards = [...CARD_CATALOG, ...hydratedCustomCards];

      // 2. Populate Ability Datalist
      const abilityDatalist = document.getElementById('ability-options');
      allAbilities.forEach(ab => {
          const opt = document.createElement('option');
          opt.value = ab.name;
          abilityDatalist.appendChild(opt);
      });

      // 3. Attach Listeners
      const inputs = document.querySelectorAll('input:not(#add-ability-input):not(#catalog-search), select, textarea');
      inputs.forEach(el => {
          el.addEventListener('input', updatePreview);
          el.addEventListener('change', updatePreview);
      });

      document.getElementById('card-type').addEventListener('change', toggleStatFields);
      
      const addAbilityInput = document.getElementById('add-ability-input');
      addAbilityInput.addEventListener('change', (e) => {
          const val = e.target.value.toLowerCase();
          const match = allAbilities.find(a => a.name.toLowerCase() === val);
          
          if (match) {
              if (!currentAbilities.includes(match.abilityId)) {
                  currentAbilities.push(match.abilityId);
                  renderAssignedAbilities();
                  updatePreview();
              }
              e.target.value = ''; // Reset input
              e.target.blur(); // Dismiss keyboard/dropdown
          }
      });

      const catalogEl = document.getElementById('card-catalog');
      catalogEl.addEventListener('new-item', resetForm);

      document.getElementById('save-card-btn').addEventListener('click', saveCard);
      
      const topbar = document.getElementById('studio-topbar');
      topbar.addEventListener('save', saveCard);
      topbar.addEventListener('clone', cloneCard);
      topbar.addEventListener('test', window.launchTestMatch);
      topbar.addEventListener('delete', deleteCard);
      topbar.addEventListener('import', (e) => {
          const data = e.detail;
          data.id = 'card_' + Date.now();
          allCards.push(data);
          window.loadCard(data.id);
          document.getElementById('card-name').value += ' (Imported)';
          updatePreview();
      });

      const urlParams = new URLSearchParams(window.location.search);
      const hashId = window.location.hash.replace('#', '');
      const loadId = urlParams.get('id') || hashId;

      renderCatalog();
      resetForm();

      if (loadId) {
          setTimeout(() => window.loadCard(loadId), 50);
      }
    }

    function toggleStatFields() {
        const type = document.getElementById('card-type').value;
        const hpContainer = document.getElementById('stat-health-container');
        const strContainer = document.getElementById('stat-strength-container');
        const lineContainer = document.getElementById('default-line-container');
        
        if (type === 'unit' || type === 'avatar') {
            hpContainer.classList.remove('hidden');
            strContainer.classList.remove('hidden');
        } else {
            hpContainer.classList.add('hidden');
            strContainer.classList.add('hidden');
        }

        if (type === 'unit') {
            lineContainer.classList.remove('hidden');
        } else {
            lineContainer.classList.add('hidden');
        }

        if (type === 'equipment') {
            const attachAb = allAbilities.find(a => a.name.toLowerCase() === 'attach to a unit' || a.name.toLowerCase() === 'attach');
            if (attachAb && !currentAbilities.includes(attachAb.abilityId)) {
                currentAbilities.push(attachAb.abilityId);
                renderAssignedAbilities();
                updatePreview();
            }
        }
    }

    function renderAssignedAbilities() {
        const container = document.getElementById('assigned-abilities');
        if (currentAbilities.length === 0) {
            container.innerHTML = `<span class="text-xs text-slate-500 italic">No abilities assigned.</span>`;
            return;
        }

        container.innerHTML = currentAbilities.map((abId, index) => {
            const ab = allAbilities.find(a => a.abilityId === abId);
            if (!ab) return '';
            return `
                <div draggable="true" 
                     ondragstart="window.handleDragStart(event, ${index})"
                     ondragover="window.handleDragOver(event)"
                     ondrop="window.handleDrop(event, ${index})"
                     ondragend="window.handleDragEnd(event)"
                     class="flex justify-between items-center bg-indigo-950/40 hover:bg-indigo-900/60 border border-indigo-900 p-2 rounded text-xs cursor-move transition-colors">
                    <div class="pointer-events-none flex items-center gap-2">
                        <span class="text-indigo-500/50 text-[10px]">☰</span>
                        <span class="font-bold text-indigo-300">${ab.name}</span>
                        <span class="text-[9px] bg-indigo-900 text-indigo-200 px-1 py-0.5 rounded ml-1">${ab.trigger || 'MANUAL'}</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <a href="ability_editor.html#${ab.abilityId}" target="_blank" onclick="event.stopPropagation()" title="Open Ability in Studio" class="text-indigo-400 hover:text-indigo-200 transition p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-3.5 h-3.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" /></svg>
                        </a>
                        <button onclick="window.removeAbility(${index})" class="text-red-400 hover:text-red-300 font-black px-1.5">&times;</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.removeAbility = (index) => {
        currentAbilities.splice(index, 1);
        renderAssignedAbilities();
        updatePreview();
    };

    window.handleDragStart = (e, index) => {
        draggedAbilityIndex = index;
        e.dataTransfer.effectAllowed = 'move';
        setTimeout(() => e.target.classList.add('opacity-50'), 0);
    };

    window.handleDragOver = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
    };

    window.handleDrop = (e, targetIndex) => {
        e.preventDefault();
        if (draggedAbilityIndex === null || draggedAbilityIndex === targetIndex) return;
        const draggedItem = currentAbilities.splice(draggedAbilityIndex, 1)[0];
        currentAbilities.splice(targetIndex, 0, draggedItem);
        renderAssignedAbilities();
        updatePreview();
    };

    window.handleDragEnd = (e) => {
        draggedAbilityIndex = null;
        e.target.classList.remove('opacity-50');
        renderAssignedAbilities();
    };

    function resetForm() {
        currentEditingId = null;
        window.location.hash = '';
        document.getElementById('form-title').innerText = '⚡ Design New Card';
        document.getElementById('card-name').value = '';
        document.getElementById('card-tribe').value = 'Robot';
        document.getElementById('card-type').value = 'unit';
        document.getElementById('card-default-line').value = 'mid';
        document.getElementById('card-genus').value = '';
        document.getElementById('card-cost').value = '1';
        document.getElementById('card-health').value = '1';
        document.getElementById('card-strength').value = '';
        document.getElementById('card-art').value = '';
        document.getElementById('card-description').value = '';
        
        currentAbilities = [];
        
        document.getElementById('studio-topbar').showButtons(false);
        
        toggleStatFields();
        renderAssignedAbilities();
        updatePreview();
    }

    function buildCardState() {
        const strVal = document.getElementById('card-strength').value;
        const cardType = document.getElementById('card-type').value;
        
        const state = {
            id: currentEditingId || ('card_' + Date.now()),
            updatedAt: Date.now(),
            name: document.getElementById('card-name').value || 'Unnamed Card',
            tribe: document.getElementById('card-tribe').value,
            type: cardType,
            genus: document.getElementById('card-genus').value || 'Generic',
            cost: parseInt(document.getElementById('card-cost').value) || 0,
            health: parseInt(document.getElementById('card-health').value) || 1,
            maxHealth: parseInt(document.getElementById('card-health').value) || 1,
            strength: strVal === '' ? null : parseInt(strVal),
            description: document.getElementById('card-description').value || '',
            artUrl: document.getElementById('card-art').value || '',
            abilities: (currentAbilities || []).map(id => allAbilities.find(a => a.abilityId === id)).filter(Boolean)
        };
        
        if (cardType === 'unit') {
            state.defaultLine = document.getElementById('card-default-line').value;
        }
        
        return state;
    }

    window.copyCardJSON = () => {
        const card = buildCardState();
        navigator.clipboard.writeText(JSON.stringify(card, null, 2)).then(() => {
            showToast('Card JSON Copied!', 'success');
        });
    };

    window.inspectMiniPreview = () => {
        const card = buildCardState();
        openInspectionModal(card, allAbilities);
    };

    function updatePreview() {
        const card = buildCardState();
        const container = document.getElementById('card-preview-container');
        container.innerHTML = renderCardHTML(card, { 
            isPlayable: true,
            onInspect: 'window.inspectMiniPreview()'
        });
        
        renderJSONPreview('json-preview-container', card, 'copyCardJSON');
    }

    async function saveCard() {
        const card = buildCardState();
        if (!card.name || card.name.trim() === 'Unnamed Card') {
            showToast('Please provide a name for the card.', 'error');
            return;
        }

        const btn = document.getElementById('save-card-btn');
        const origText = btn.innerHTML;
        btn.innerHTML = 'Saving...';
        btn.disabled = true;
        
        const topbar = document.getElementById('studio-topbar');
        if (topbar && topbar.setLoading) topbar.setLoading('save', true);

        const cloudSaveSuccess = await saveCardToCatalog(card);
        
        // Update local catalog
        allCards = [...allCards.filter(c => c.id !== card.id), card];
        currentEditingId = card.id;
        
        document.getElementById('form-title').innerText = `⚡ Edit: ${card.name}`;
        document.getElementById('studio-topbar').showButtons(true);

        btn.innerHTML = origText;
        btn.disabled = false;
        
        if (topbar && topbar.setLoading) topbar.setLoading('save', false);

        if (cloudSaveSuccess) {
            showToast(`Card '${card.name}' saved successfully!`, 'success');
        } else {
            showToast(`⚠️ Cloud save failed! Card '${card.name}' saved locally.`, 'error');
        }
        renderCatalog();
    }

    function cloneCard() {
        if (!currentEditingId) return;
        currentEditingId = null;
        document.getElementById('form-title').innerText = `⚡ Design New Card (Cloned)`;
        document.getElementById('card-name').value += ' (Copy)';
        document.getElementById('studio-topbar').showButtons(false);
        updatePreview();
        showToast('Card cloned! Save to keep it.', 'info');
    }

    async function deleteCard() {
        if (!currentEditingId) return;
        await deleteCardFromCatalog(currentEditingId);
        allCards = allCards.filter(c => c.id !== currentEditingId);
        showToast('Card deleted.', 'success');
        resetForm();
        renderCatalog();
    }

    window.launchTestMatch = async () => {
        const card = buildCardState();
        const topbar = document.getElementById('studio-topbar');
        if (topbar && topbar.setLoading) topbar.setLoading('test', true);

        await launchSandboxMatch(card, 'card');
        
        if (topbar && topbar.setLoading) topbar.setLoading('test', false);
    };

    function renderCatalog() {
        const catalogEl = document.getElementById('card-catalog');
        if (!catalogEl) return;
        
        catalogEl.setItems(allCards, (c) => {
            return `
            <div onclick="window.loadCard('${c.id}')" class="p-2 bg-slate-900 border border-slate-800 hover:border-amber-500 rounded-xl text-xs flex justify-between items-center cursor-pointer transition">
                <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded bg-amber-500 text-black font-extrabold flex items-center justify-center text-[10px]">${c.cost || 0}</span>
                    <div class="flex flex-col">
                        <span class="font-bold text-amber-300">${c.name}</span>
                        <span class="text-[9px] text-slate-400 capitalize">${c.tribe} • ${c.type}</span>
                    </div>
                </div>
                ${c.abilities && c.abilities.length > 0 ? `<span class="text-[9px] bg-indigo-950 text-indigo-300 px-1.5 py-0.5 rounded border border-indigo-900">${c.abilities.length} Abil</span>` : ''}
            </div>
            `;
        });
    }

    window.loadCard = (id) => {
        const card = allCards.find(c => c.id === id);
        if (!card) return;

        currentEditingId = card.id;
        window.location.hash = id;
        document.getElementById('form-title').innerText = `⚡ Edit: ${card.name}`;
        document.getElementById('card-name').value = card.name;
        document.getElementById('card-tribe').value = card.tribe || 'Generic';
        document.getElementById('card-type').value = card.type || 'unit';
        document.getElementById('card-default-line').value = card.defaultLine || 'mid';
        document.getElementById('card-genus').value = card.genus || '';
        document.getElementById('card-cost').value = card.cost || 0;
        document.getElementById('card-health').value = card.maxHealth || card.health || 1;
        document.getElementById('card-strength').value = (card.strength !== undefined && card.strength !== null) ? card.strength : '';
        document.getElementById('card-art').value = card.artUrl || '';
        document.getElementById('card-description').value = card.description || '';
        
        currentAbilities = (card.abilities || []).map(a => a.abilityId || a);
        
        document.getElementById('studio-topbar').showButtons(true);
        
        toggleStatFields();
        renderAssignedAbilities();
        updatePreview();
    };
  </script>
</body>
</html>
