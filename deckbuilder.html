<!-- filepath: deckbuilder.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henchies 2 - Deckbuilder Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

  <!-- Toast Container Top Center -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none max-w-md w-full px-4 items-center"></div>

  <!-- Header -->
  <main-nav active-page="deckbuilder" subtitle="Deckbuilder & Construction Studio"></main-nav>

  <!-- Deckbuilder Content -->
  <main class="flex-1 max-w-[1600px] w-full mx-auto p-4 flex flex-col xl:flex-row gap-4">
    
    <!-- LEFT: DECK CATALOG -->
    <div class="w-full xl:w-72 flex flex-col gap-4 shrink-0">
      <div class="glass-panel p-4 rounded-2xl border border-slate-800 shadow-xl">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-wider block mb-1">Cloud Account (Username)</label>
        <div class="flex gap-2">
          <input type="text" id="deck-owner-input" placeholder="Your Username" class="bg-slate-900 border border-slate-700 text-xs font-bold px-3 py-2 rounded text-cyan-300 w-full focus:outline-none focus:border-cyan-500" />
          <button id="refresh-cloud-btn" class="bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs px-3 rounded shadow transition">🔄</button>
        </div>
      </div>
      <studio-catalog id="deck-catalog" title="Saved Decks"></studio-catalog>
    </div>

    <!-- MIDDLE: CATALOG EXPLORER -->
    <div class="flex-1 glass-panel rounded-2xl p-4 flex flex-col gap-4 shadow-2xl border border-slate-800 min-w-0">
      <div class="flex justify-between items-end border-b border-slate-800 pb-3">
        <div class="flex flex-col gap-1 w-full max-w-sm">
          <h2 class="text-lg font-black text-amber-400 uppercase tracking-wider" id="form-title">⚡ Design Deck</h2>
          <input type="text" id="deck-name-input" value="My Custom Deck" class="bg-slate-900 border border-slate-700 text-sm font-bold px-3 py-2 rounded text-white w-full focus:outline-none focus:border-amber-500" />
        </div>
        <studio-topbar id="studio-topbar"></studio-topbar>
      </div>

      <div class="flex flex-wrap justify-between items-center gap-2 border-b border-slate-800 pb-3">
        <h2 class="text-lg font-black text-amber-400 uppercase tracking-wider">🎴 Card Catalog</h2>
        
        <!-- Filters (11 Tribes ONLY) -->
        <div class="flex flex-wrap gap-2 w-full xl:w-auto">
          <input type="text" id="filter-search" placeholder="🔍 Search cards..." class="bg-slate-900 border border-slate-700 text-xs px-2 py-1.5 rounded text-amber-300 focus:outline-none font-bold w-full xl:w-auto" />
          
          <select id="filter-tribe" class="bg-slate-900 border border-slate-700 text-xs px-2 py-1.5 rounded text-amber-300 focus:outline-none font-bold">
            <option value="ALL">All Tribes</option>
          </select>
          
          <select id="filter-type" class="bg-slate-900 border border-slate-700 text-xs px-2 py-1.5 rounded text-slate-300 focus:outline-none">
            <option value="ALL">All Types</option>
            <option value="unit">Units</option>
            <option value="spell">Spells</option>
            <option value="equipment">Equipment</option>
            <option value="artifact">Artifacts</option>
            <option value="boon">Boons</option>
          </select>
        </div>
      </div>

      <!-- Bulk Flex Wrap Catalog Container -->
      <div id="catalog-container" class="flex flex-wrap gap-3 p-2 bg-slate-950/80 rounded-xl border border-slate-800 flex-1 overflow-y-auto items-start content-start min-h-[400px]">
      </div>
    </div>

    <!-- RIGHT: ACTIVE DECK PANEL -->
    <div class="w-full xl:w-80 glass-panel rounded-2xl p-4 flex flex-col gap-3 shadow-2xl border border-slate-800 shrink-0 h-full max-h-[85vh]">
      
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h2 class="text-base font-black text-amber-400 uppercase tracking-wider">🛡️ Your Deck</h2>
        <div class="text-[10px] font-black bg-slate-900 px-2 py-1 rounded text-amber-300 border border-slate-700 shadow-inner" id="deck-count-badge">0 / 40</div>
      </div>

      <!-- Dedicated Avatar Slot -->
      <div class="flex flex-col gap-1 border-b border-slate-800 pb-3">
          <label class="text-[10px] font-black text-amber-500 uppercase tracking-wider flex justify-between">
              <span>Commander Avatar</span>
              <span id="avatar-status-text" class="text-red-400">Missing</span>
          </label>
          <div id="avatar-slot-ui" onclick="window.openAvatarSelector()" class="h-12 border-2 border-dashed border-amber-700/50 rounded-lg bg-amber-950/20 hover:bg-amber-900/30 flex items-center justify-center cursor-pointer transition-colors text-amber-500/50 font-bold text-xs shadow-inner relative overflow-hidden">
             Click to Select Avatar
          </div>
      </div>

      <!-- Rule Guidelines & Validation Banner -->
      <div id="validation-banner" class="text-[11px] p-2.5 rounded-lg bg-yellow-950/60 border border-yellow-500/40 text-yellow-300 font-semibold leading-snug">
        ⚠️ Deck Rules: 1 Avatar & exactly 40 standard cards. Max 3 copies per card, EXCEPT up to 1 card may have 4 copies.
      </div>

      <!-- Deck List (No Avatars) -->
      <div id="deck-list-container" class="flex-1 flex flex-col gap-1.5 overflow-y-auto min-h-[200px] p-1 bg-slate-950/60 rounded-xl border border-slate-800">
        <div class="text-xs text-slate-500 italic p-3 text-center">Click cards from the catalog to add them to your deck.</div>
      </div>
    </div>

  </main>

  <!-- Avatar Selection Modal -->
  <div id="avatar-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
      <div class="bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col">
          <div class="flex justify-between items-center p-4 border-b border-slate-800">
              <h3 class="text-lg font-black text-amber-400 uppercase tracking-wider">👑 Select Your Avatar</h3>
              <button onclick="document.getElementById('avatar-modal').classList.add('hidden')" class="text-slate-400 hover:text-white font-bold text-xl">&times;</button>
          </div>
          <div id="avatar-modal-catalog" class="flex-1 overflow-y-auto p-4 flex flex-wrap gap-4 justify-center bg-slate-950">
              <!-- Avatars injected here -->
          </div>
      </div>
  </div>

  <script type="module">
    import { CARD_CATALOG } from './src/engine/index.js';
    import { renderCardHTML, openInspectionModal, showToast, TRIBE_STYLES, loadUI } from './src/ui.js';
    import { fetchCustomCards, fetchCustomAbilities, saveDeckToCatalog, fetchUserDecks, fetchCustomTribes, deleteDeckFromCatalog } from './src/firebase.js';
    import { generateAbilityDescription } from './src/language_description.js';
    import { launchSandboxMatch } from './src/testing.js';
    import { hydrateAbility } from './src/engine/utils.js';
    import './components/main_nav.js';
    import './components/catalog.js';
    import './components/topbar.js';

    let fullCatalog = [...CARD_CATALOG];
    let currentDeck = [];
    let currentAvatar = null;
    let allAbilitiesRegistry = [];
    let allDecks = [];
    let currentEditingId = null;
    let customTribesList = [];

    window.inspectCard = (cardJson) => {
      openInspectionModal(JSON.parse(decodeURIComponent(cardJson)), allAbilitiesRegistry);
    };

    window.openAvatarSelector = () => {
        const avatars = fullCatalog.filter(c => c.type === 'avatar');
        const container = document.getElementById('avatar-modal-catalog');
        
        container.innerHTML = avatars.map(card => {
            const json = encodeURIComponent(JSON.stringify(card)).replace(/'/g, "%27");
            return renderCardHTML(card, {
              onClick: `window.selectAvatar('${card.id}')`,
              onInspect: `window.inspectCard('${json}')`,
              isSelected: currentAvatar && currentAvatar.id === card.id
            });
        }).join('');
        
        document.getElementById('avatar-modal').classList.remove('hidden');
        document.getElementById('avatar-modal').classList.add('flex');
    };

    window.selectAvatar = (cardId) => {
        currentAvatar = fullCatalog.find(c => c.id === cardId);
        document.getElementById('avatar-modal').classList.add('hidden');
        document.getElementById('avatar-modal').classList.remove('flex');
        updateDeckUI();
    };

    init();

    async function init() {
      await loadUI();
      try {
        customTribesList = await fetchCustomTribes();
        const tribeSelect = document.getElementById('filter-tribe');
        tribeSelect.innerHTML = '<option value="ALL">All Tribes</option>' + customTribesList.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

        const customCards = await fetchCustomCards();
        const tempCards = [...CARD_CATALOG, ...customCards];

        const rawAbs = await fetchCustomAbilities();
        allAbilitiesRegistry = rawAbs.map(ab => ({
            ...ab,
            displayDescription: generateAbilityDescription(ab, rawAbs, tempCards)
        }));

        if (customCards && customCards.length > 0) {
           const hydratedCustomCards = customCards.map(c => {
               if (c.abilities) {
                   c.abilities = c.abilities.map(ab => hydrateAbility(ab, rawAbs)).filter(Boolean);
               }
               return c;
           });
           fullCatalog = [...CARD_CATALOG, ...hydratedCustomCards];
        }
      } catch (e) {
        console.error("Failed to load custom cards:", e);
      }
      
      const savedOwner = localStorage.getItem('henchies_deck_owner');
      if (savedOwner) {
          document.getElementById('deck-owner-input').value = savedOwner;
          refreshLoadDropdown();
      }

      document.getElementById('filter-tribe').addEventListener('change', renderCatalog);
      document.getElementById('filter-type').addEventListener('change', renderCatalog);
      document.getElementById('filter-search').addEventListener('input', renderCatalog);
      document.getElementById('deck-owner-input').addEventListener('input', () => localStorage.setItem('henchies_deck_owner', document.getElementById('deck-owner-input').value));
      document.getElementById('refresh-cloud-btn').addEventListener('click', refreshLoadDropdown);
      
      const topbar = document.getElementById('studio-topbar');
      topbar.addEventListener('save', saveDeck);
      topbar.addEventListener('clone', cloneDeck);
      topbar.addEventListener('delete', deleteDeck);
      topbar.addEventListener('test', () => { if(window.launchTestMatch) window.launchTestMatch(); });
      
      // Hide irrelevant topbar buttons
      topbar.querySelector('#btn-import').classList.add('hidden');

      const deckCatalogEl = document.getElementById('deck-catalog');
      deckCatalogEl.addEventListener('new-item', resetForm);

      renderCatalog();
      resetForm();
      updateDeckUI();
    }

    function renderCatalog() {
      const tribeVal = document.getElementById('filter-tribe').value;
      const typeVal = document.getElementById('filter-type').value;
      const searchVal = document.getElementById('filter-search').value.toLowerCase();

      let targetTribeName = '';
      if (tribeVal !== 'ALL') {
          const t = customTribesList.find(t => t.id === tribeVal);
          if (t) targetTribeName = t.name.toLowerCase();
      }

      // IMPORTANT: Hide Avatars from main catalog
      const filtered = fullCatalog.filter(c => {
        if (c.type === 'avatar') return false; 
        
        let matchTribe = (tribeVal === 'ALL');
        if (!matchTribe) {
            const cTribe = (c.tribe || '').toLowerCase();
            matchTribe = (cTribe === tribeVal.toLowerCase() || cTribe === targetTribeName);
        }
        
        const matchType = typeVal === 'ALL' || c.type === typeVal;
        const matchSearch = (c.name || '').toLowerCase().includes(searchVal) || 
                            (c.genus || '').toLowerCase().includes(searchVal) ||
                            (c.family || '').toLowerCase().includes(searchVal);

        return matchTribe && matchType && matchSearch;
      });

      const container = document.getElementById('catalog-container');
      container.innerHTML = filtered.map(card => {
        const json = encodeURIComponent(JSON.stringify(card)).replace(/'/g, "%27");
        return renderCardHTML(card, {
          onClick: `window.addToDeck('${card.id}')`,
          onInspect: `window.inspectCard('${json}')`
        });
      }).join('');

      window.addToDeck = (cardId) => {
        const card = fullCatalog.find(c => c.id === cardId);
        if (!card) return;

        const existingCount = currentDeck.filter(c => c.id === cardId).length;

        if (existingCount >= 4) {
          showToast('Maximum 4 copies allowed for a single card!', 'error');
          return;
        }

        if (existingCount === 3) {
          const counts = {};
          currentDeck.forEach(c => counts[c.id] = (counts[c.id] || 0) + 1);
          const fourCopyCards = Object.keys(counts).filter(id => counts[id] === 4);

          if (fourCopyCards.length >= 1) {
            showToast('Rule Violation: Only ONE card may have 4 copies!', 'error');
            return;
          }
        }

        if (currentDeck.length >= 40) {
          showToast('Deck already has 40 standard cards!', 'error');
          return;
        }

        currentDeck.push(card);
        updateDeckUI();
      };
    }

    function validateDeckRules() {
      if (!currentAvatar) return { valid: false, reason: `Missing Avatar. Please select a Commander.` };
      if (currentDeck.length !== 40) return { valid: false, reason: `Deck must have exactly 40 cards (Currently ${currentDeck.length}).` };

      const counts = {};
      currentDeck.forEach(c => counts[c.id] = (counts[c.id] || 0) + 1);

      const fourCopyCards = Object.keys(counts).filter(id => counts[id] === 4);
      const overFourCards = Object.keys(counts).filter(id => counts[id] > 4);

      if (overFourCards.length > 0) {
        return { valid: false, reason: 'No card may have more than 4 copies.' };
      }

      if (fourCopyCards.length > 1) {
        return { valid: false, reason: `Deck can have at most ONE card with 4 copies (Currently ${fourCopyCards.length}).` };
      }

      return { valid: true, reason: '✅ Deck Valid (40 Cards + 1 Avatar, valid copies).' };
    }

    function updateDeckUI() {
      // Pin tribe, then cost
      currentDeck.sort((a, b) => {
          const tribeA = a.tribe || '';
          const tribeB = b.tribe || '';
          if (tribeA !== tribeB) return tribeA.localeCompare(tribeB);
          return (a.cost || 0) - (b.cost || 0);
      });

      const badge = document.getElementById('deck-count-badge');
      const container = document.getElementById('deck-list-container');
      const banner = document.getElementById('validation-banner');
      const avatarSlot = document.getElementById('avatar-slot-ui');
      const avatarStatus = document.getElementById('avatar-status-text');

      badge.innerText = `${currentDeck.length} / 40`;

      if (currentAvatar) {
          const style = TRIBE_STYLES[currentAvatar.tribe] || { bg: 'bg-slate-900', border: 'border-black' };
          avatarStatus.innerText = "Assigned";
          avatarStatus.className = "text-emerald-400";
          avatarSlot.className = `h-14 rounded-lg flex items-center justify-between p-2 cursor-pointer shadow-lg border-2 border-amber-500/50 ${style.bg}`;
          avatarSlot.innerHTML = `
              <div class="flex items-center gap-3">
                  <span class="text-2xl drop-shadow-md">👑</span>
                  <div class="flex flex-col">
                      <span class="font-black text-white text-sm drop-shadow-md tracking-wider">${currentAvatar.name}</span>
                      <span class="text-[9px] text-slate-300 capitalize font-bold">${currentAvatar.tribe} Avatar</span>
                  </div>
              </div>
              <span class="text-xs text-amber-300 font-bold bg-black/40 px-2 py-1 rounded">Change</span>
          `;
      } else {
          avatarStatus.innerText = "Missing";
          avatarStatus.className = "text-red-400 font-bold animate-pulse";
          avatarSlot.className = `h-12 border-2 border-dashed border-amber-700/50 rounded-lg bg-amber-950/20 hover:bg-amber-900/30 flex items-center justify-center cursor-pointer transition-colors text-amber-500/50 font-bold text-xs shadow-inner relative overflow-hidden`;
          avatarSlot.innerHTML = `Click to Select Avatar`;
      }

      const check = validateDeckRules();
      if (check.valid) {
        banner.className = 'text-[11px] p-2.5 rounded-lg bg-emerald-950/80 border border-emerald-500/50 text-emerald-300 font-bold shadow-lg';
        banner.innerText = check.reason;
      } else {
        banner.className = 'text-[11px] p-2.5 rounded-lg bg-yellow-950/80 border border-yellow-500/50 text-yellow-300 font-bold shadow-lg';
        banner.innerText = `⚠️ ${check.reason}`;
      }

      if (currentDeck.length === 0) {
        container.innerHTML = `<div class="text-xs text-slate-500 italic p-3 text-center">Click cards from the catalog to add them to your deck.</div>`;
        return;
      }

      const cardMap = {};
      currentDeck.forEach(c => {
        if (!cardMap[c.id]) cardMap[c.id] = { card: c, count: 0 };
        cardMap[c.id].count++;
      });

      container.innerHTML = Object.values(cardMap).map(entry => {
        const style = TRIBE_STYLES[entry.card.tribe] || { bg: 'bg-slate-900' };
        const costVal = typeof entry.card.cost === 'object' ? (entry.card.cost.tribeAmount || entry.card.cost.carnie || entry.card.cost.tent || 0) : (entry.card.cost ?? 0);
        const json = encodeURIComponent(JSON.stringify(entry.card)).replace(/'/g, "%27");
        return `
        <div class="flex justify-between items-center p-2 rounded-lg ${style.bg} border border-black/40 text-xs shadow-sm group hover:border-amber-500/50 transition-colors">
          <div class="flex items-center gap-2 flex-1 overflow-hidden cursor-pointer hover:text-amber-300 transition-colors" onclick="window.filterToCard('${entry.card.name.replace(/'/g, "\\'")}')" oncontextmenu="event.preventDefault(); window.inspectCard('${json}')" title="Left-click to filter, Right-click to inspect: ${entry.card.name}">
            <span class="w-5 h-5 rounded bg-amber-500 text-black font-extrabold text-[10px] flex items-center justify-center shadow-sm border border-amber-700 shrink-0">${costVal}</span>
            <span class="font-bold text-white drop-shadow-md truncate">${entry.card.name}</span>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="window.decrementCard('${entry.card.id}')" class="bg-slate-800 hover:bg-slate-600 text-white rounded w-5 h-5 flex items-center justify-center font-bold border border-slate-600 shadow-sm transition">-</button>
            <span class="${entry.count === 4 ? 'text-amber-300 font-black ring-1 ring-amber-300 px-1 rounded bg-black/40 shadow-inner inline-block text-center min-w-[20px]' : 'text-slate-100 font-bold bg-black/20 px-1 rounded inline-block text-center min-w-[20px]'}">x${entry.count}</span>
            <button onclick="window.incrementCard('${entry.card.id}')" class="bg-slate-800 hover:bg-slate-600 text-white rounded w-5 h-5 flex items-center justify-center font-bold border border-slate-600 shadow-sm transition">+</button>
            <button onclick="window.removeFromDeck('${entry.card.id}')" class="text-red-400 hover:text-white hover:bg-red-900/80 rounded px-1.5 py-0.5 font-bold transition ml-1">✕</button>
          </div>
        </div>
      `}).join('');

      window.removeFromDeck = (cardId) => {
        currentDeck = currentDeck.filter(c => c.id !== cardId);
        updateDeckUI();
      };
      
      window.incrementCard = (cardId) => {
        window.addToDeck(cardId);
      };
      
      window.decrementCard = (cardId) => {
        const idx = currentDeck.findIndex(c => c.id === cardId);
        if (idx !== -1) {
          currentDeck.splice(idx, 1);
          updateDeckUI();
        }
      };

      window.filterToCard = (cardName) => {
        document.getElementById('filter-search').value = cardName;
        renderCatalog();
      };
    }

    window.launchTestMatch = async () => {
        const check = validateDeckRules();
        if (!check.valid) {
            showToast(`Cannot test invalid deck: ${check.reason}`, 'error');
            return;
        }

        const topbar = document.getElementById('studio-topbar');
        if (topbar && topbar.setLoading) topbar.setLoading('test', true);

        try {
            const rawAbs = await fetchCustomAbilities();
            const rawCards = await fetchCustomCards();
            const combinedCatalog = [...CARD_CATALOG, ...rawCards];

            const hydratedDeck = [currentAvatar, ...currentDeck].filter(Boolean).map(c => {
                const fresh = combinedCatalog.find(cat => cat.id === c.id);
                if (!fresh) return null;
                const clone = JSON.parse(JSON.stringify(fresh));
                if (clone.abilities) {
                    clone.abilities = clone.abilities.map(ab => hydrateAbility(ab, rawAbs)).filter(Boolean);
                }
                return clone;
            }).filter(Boolean);

            await launchSandboxMatch(hydratedDeck, 'deck');
        } catch(e) {
            console.error("Test match error:", e);
            showToast('Failed to launch test match.', 'error');
        }

        if (topbar && topbar.setLoading) topbar.setLoading('test', false);
    };

    async function saveDeck() {
        const check = validateDeckRules();
        if (!check.valid) {
            showToast(`Cannot save: ${check.reason}`, 'error');
            return;
        }

        const deckName = document.getElementById('deck-name-input').value.trim();
        const owner = document.getElementById('deck-owner-input').value.trim();

        if (!deckName || !owner) {
            showToast('Please provide a Deck Name and Cloud Account (Username).', 'error');
            return;
        }

        const topbar = document.getElementById('studio-topbar');
        if (topbar && topbar.setLoading) topbar.setLoading('save', true);

        // Map full objects down to IDs for storage
        const payload = [currentAvatar.id, ...currentDeck.map(c => c.id)];

        const success = await saveDeckToCatalog(owner, deckName, payload);

        if (topbar && topbar.setLoading) topbar.setLoading('save', false);

        if (success) {
            showToast(`Deck '${deckName}' saved successfully!`, 'success');
            currentEditingId = deckName;
            document.getElementById('form-title').innerText = `⚡ Edit: ${deckName}`;
            document.getElementById('studio-topbar').showButtons(true);
            await refreshLoadDropdown();
        } else {
            showToast(`Failed to save deck to cloud.`, 'error');
        }
    }

    function cloneDeck() {
        currentEditingId = null;
        document.getElementById('form-title').innerText = `⚡ Design New Deck (Cloned)`;
        document.getElementById('deck-name-input').value += ' (Copy)';
        document.getElementById('studio-topbar').showButtons(false);
        showToast('Deck cloned! Save to keep it.', 'info');
    }

    async function deleteDeck() {
        if (!currentEditingId) return;
        const owner = document.getElementById('deck-owner-input').value.trim();
        
        const topbar = document.getElementById('studio-topbar');
        if (topbar && topbar.setLoading) topbar.setLoading('delete', true);

        const success = await deleteDeckFromCatalog(owner, currentEditingId);
        
        if (topbar && topbar.setLoading) topbar.setLoading('delete', false);

        if (success) {
            showToast('Deck deleted.', 'success');
            resetForm();
            await refreshLoadDropdown();
        } else {
            showToast('Failed to delete deck.', 'error');
        }
    }

    async function refreshLoadDropdown() {
      const owner = document.getElementById('deck-owner-input').value.trim();
      if (!owner) {
          allDecks = [];
          renderDeckCatalog();
          return;
      }
      
      const btn = document.getElementById('refresh-cloud-btn');
      btn.classList.add('animate-spin');
      
      const userDecks = await fetchUserDecks(owner);
      
      btn.classList.remove('animate-spin');
      
      allDecks = Object.keys(userDecks).map(name => {
          const docData = userDecks[name];
          const rawCards = docData.deckData || [];
          const tags = rawCards.map(ref => {
              const cid = ref.id || ref;
              const f = fullCatalog.find(c => c.id === cid);
              if (!f) return '';
              let tribeName = f.tribe || '';
              const matchedTribe = customTribesList.find(t => t.id === f.tribe || t.name === f.tribe);
              if (matchedTribe) tribeName += ' ' + matchedTribe.name;
              return `${f.name} ${tribeName}`;
          }).join(' ');

          return {
              id: name,
              name: name,
              deckData: rawCards,
              searchTags: tags,
              updatedAt: docData.updatedAt || Date.now()
          };
      });
      
      renderDeckCatalog();
    }

    function renderDeckCatalog() {
        const catalogEl = document.getElementById('deck-catalog');
        if (!catalogEl) return;
        
        catalogEl.setItems(allDecks, (d) => {
            const cardCount = d.deckData ? d.deckData.length : 0;
            return `
            <div onclick="window.loadDeck('${d.id}')" class="p-2 bg-slate-900 border border-slate-800 hover:border-amber-500 rounded-xl text-xs flex justify-between items-center cursor-pointer transition">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🎴</span>
                    <div class="flex flex-col">
                        <span class="font-bold text-amber-300">${d.name}</span>
                        <span class="text-[9px] text-slate-400">${cardCount} Cards</span>
                    </div>
                </div>
            </div>
            `;
        });
    }

    window.loadDeck = (deckName) => {
      const deckObj = allDecks.find(d => d.id === deckName);
      if (!deckObj) return;

      const loadedData = deckObj.deckData;
      
      if (!Array.isArray(loadedData) || loadedData.length === 0) {
          showToast('Corrupted deck data.', 'error');
          return;
      }

      // Map ID references back to full catalog cards
      const hydratedDeck = loadedData.map(ref => {
          const cardId = ref.id || ref; 
          const fullCard = fullCatalog.find(c => c.id === cardId);
          return fullCard ? JSON.parse(JSON.stringify(fullCard)) : null;
      }).filter(Boolean);

      if (hydratedDeck.length < loadedData.length) {
          showToast(`Warning: ${loadedData.length - hydratedDeck.length} cards were removed because they no longer exist in the catalog.`, 'error');
      }

      const potentialAvatar = hydratedDeck[0];
      if (potentialAvatar && potentialAvatar.type === 'avatar') {
          currentAvatar = potentialAvatar;
          currentDeck = hydratedDeck.slice(1);
      } else {
          currentAvatar = null;
          currentDeck = hydratedDeck;
      }

      currentEditingId = deckName;
      document.getElementById('deck-name-input').value = deckName;
      document.getElementById('form-title').innerText = `⚡ Edit: ${deckName}`;
      document.getElementById('studio-topbar').showButtons(true);

      updateDeckUI();
      showToast(`Loaded deck: ${deckName}`, 'success');
    }

    function resetForm() {
        currentEditingId = null;
        document.getElementById('form-title').innerText = '⚡ Design New Deck';
        document.getElementById('deck-name-input').value = 'My Custom Deck';
        currentDeck = [];
        currentAvatar = null;
        document.getElementById('studio-topbar').showButtons(false);
        updateDeckUI();
    }
  </script>
</body>
</html>
