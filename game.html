<!-- filepath: game.html -->
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Henchies 2 - Tabletop Card Battler</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .glass-panel {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

  <!-- Toast Container Top Center -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-[110] flex flex-col gap-2 pointer-events-none max-w-md w-full px-4 items-center"></div>

  <!-- Header Navigation -->
  <main-nav active-page="game" subtitle="Match Setup Lobby"></main-nav>

  <!-- SCREEN 1: MATCH SETUP & DECK SELECTOR -->
  <match-lobby></match-lobby>

  <!-- SCREEN 2: TABLETOP MATCH BOARD (HIDDEN INITIALLY) -->
  <main id="match-tabletop-screen" class="flex-1 max-w-full w-full mx-auto p-1 sm:p-2 flex flex-col gap-1 hidden">

    <!-- Active Player Turn Indicator & Phase Bar -->
    <div class="glass-panel rounded-lg p-1.5 flex flex-wrap justify-between items-center gap-2 border border-amber-500/30 w-full shrink-0 sticky top-0 z-50 shadow-[0_10px_20px_rgba(0,0,0,0.5)]">
      <div class="flex items-center gap-2">
        <div id="turn-badge" class="px-2 py-0.5 rounded bg-amber-500 text-black font-extrabold text-[10px] uppercase shadow-sm">
          Turn 1: Player 1
        </div>
        <div id="phase-badge" class="px-2 py-0.5 rounded bg-slate-800 text-amber-300 font-semibold text-[10px] border border-slate-700">
          DRAW DECISION
        </div>
        <span class="text-[10px] text-slate-300 font-semibold transition-colors ml-2 hidden md:block" id="action-phase-instruction">
          Phase 2: Play cards, attack targets, or equip items.
        </span>
      </div>
      <div class="flex items-center gap-2">
        <div id="active-lock-notice" class="text-[10px] font-bold text-yellow-400 hidden">
          🔒 Opponent's Turn - Locked
        </div>
        <div id="phase3-action-controls" class="flex items-center gap-1.5 hidden">
            <button id="cancel-action-btn" class="hidden bg-slate-700 hover:bg-slate-600 text-white text-[10px] font-bold px-2 py-1 rounded shadow border border-slate-500 transition">
              Cancel Target
            </button>
            <button id="restart-match-btn" onclick="window.handleRestartMatch()" class="hidden bg-sky-600 hover:bg-sky-500 text-white text-[10px] font-extrabold px-3 py-1 rounded shadow border border-sky-500 transition" title="Restart Match">
              Restart 🔄
            </button>
            <button id="undo-action-btn" onclick="window.handleUndo()" class="hidden bg-yellow-600 hover:bg-yellow-500 text-black text-[10px] font-extrabold px-3 py-1 rounded shadow border border-yellow-500 transition" title="Hotkey: U">
              Undo [U] ↩️
            </button>
            <button id="end-turn-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-[10px] font-extrabold px-3 py-1 rounded shadow border border-emerald-400 transition" title="Hotkey: E">
              End Turn [E] 🏁
            </button>
        </div>
      </div>
    </div>

    <!-- Replay Scrubbing & Status Bar (Hidden) -->
    <div id="replay-bar-container" class="w-full hidden"></div>

    <!-- TABLETOP VERTICAL MIRROR BOARD -->
    <div class="glass-panel rounded-xl p-1.5 flex flex-col gap-1.5 shadow-2xl relative border border-slate-800 w-full overflow-x-auto">
      
      <!-- OPPONENT BOARD (TOP) -->
      <div class="flex flex-col gap-1 p-1 bg-slate-950/60 rounded-lg border border-red-950/40 min-w-[800px]" id="opponent-board">
        <div class="flex justify-between items-end border-b border-slate-800/60 pb-1 px-1">
          <div class="flex items-baseline gap-2">
            <div class="font-extrabold text-xs text-red-400 leading-none" id="opp-name">Opponent (P2)</div>
            <div class="text-[9px] text-slate-400 leading-none" id="opp-resources">Loading Resources...</div>
          </div>
          <div class="text-[9px] leading-none">
            <span class="text-slate-400">Power: <strong id="opp-power" class="text-amber-400 text-xs">0</strong></span>
            <span class="ml-2 text-slate-400">Hand: <strong id="opp-hand-count" class="text-white text-xs">0</strong></span>
          </div>
        </div>

        <div class="flex flex-row gap-2 w-full mt-0.5">
            <div class="shrink-0 flex flex-col justify-end" id="opp-deck-container"></div>
            
            <div class="flex-1 flex flex-col gap-1">
                <div id="opp-lines-container" class="grid grid-cols-4 gap-1 w-full items-stretch">
                    <div class="flex flex-col gap-1 col-span-1 h-full">
                        <div id="opp-line-avatar" class="grow flex flex-wrap justify-center items-center content-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-slate-900/40 border border-slate-800/80"></div>
                        <div id="opp-line-bodyguard" class="grow flex flex-wrap justify-center items-center content-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-purple-950/20 border border-purple-900/40 hidden"></div>
                    </div>
                    <div class="flex flex-col gap-1 col-span-2 h-full">
                        <div id="opp-line-sheltered" class="grow flex flex-wrap justify-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-slate-900/40 border border-slate-800/80 hidden"></div>
                        <div id="opp-line-back" class="grow flex flex-wrap justify-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-slate-900/40 border border-slate-800/80 hidden"></div>
                        <div id="opp-line-mid" class="grow flex flex-wrap justify-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-slate-900/40 border border-slate-800/80 hidden"></div>
                        <div id="opp-line-front" class="grow flex flex-wrap justify-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-slate-900/40 border border-slate-800/80"></div>
                    </div>
                    <div class="flex flex-col gap-1 col-span-1 h-full">
                        <div id="opp-line-sideline" class="grow flex flex-wrap justify-center items-center content-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-blue-950/20 border border-blue-900/40"></div>
                    </div>
                </div>
                <div id="opp-line-taunt" class="flex flex-wrap justify-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-amber-950/20 border border-amber-900/40 hidden w-full"></div>
            </div>
            
            <div class="shrink-0 flex flex-col justify-end" id="opp-discard-container"></div>
        </div>
      </div>

      <!-- THE EQUATOR (CENTER NEUTRAL ZONE) -->
      <div class="bg-gradient-to-r from-amber-950/40 via-yellow-900/20 to-amber-950/40 border border-dashed border-amber-500/40 rounded-lg p-1 min-h-[179px] sm:min-h-[201px] flex items-center gap-2 min-w-[800px]">
        <span class="text-[9px] uppercase tracking-widest font-black text-amber-400 whitespace-nowrap shrink-0 pl-1">⚡ Equator</span>
        <div id="equator-cards-container" class="flex flex-wrap justify-center gap-1 items-center w-full">
          <span class="text-[10px] text-slate-500 italic" id="equator-empty-msg">No unattached items.</span>
        </div>
      </div>

      <!-- LOCAL PLAYER BOARD (BOTTOM) -->
      <div class="flex flex-col gap-1 p-1 bg-slate-950/60 rounded-lg border border-emerald-950/40 min-w-[800px] transition-all duration-300" id="player-board">
        <div class="flex justify-between items-end border-b border-slate-800/60 pb-1 px-1 mb-1">
          <div class="flex items-baseline gap-2">
            <div class="font-extrabold text-xs text-emerald-400 leading-none" id="player-name">Local Player (P1)</div>
            <div class="text-[9px] text-slate-400 leading-none" id="player-resources">Loading Resources...</div>
          </div>
        </div>

        <div id="player-lines-container" class="flex flex-row gap-2 w-full">
            <div class="shrink-0 flex flex-col justify-start" id="player-deck-container"></div>
            
            <div class="flex-1 flex flex-col gap-1">
                <div id="player-line-taunt" class="flex flex-wrap justify-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-amber-950/20 border border-amber-900/40 hidden w-full transition-colors" onclick="window.handleLineClick('player', 'taunt')"></div>
                <div class="grid grid-cols-4 gap-1 w-full items-stretch">
                    <div class="flex flex-col gap-1 col-span-1 h-full">
                        <div id="player-line-bodyguard" class="grow flex flex-wrap justify-center items-center content-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-purple-950/20 border border-purple-900/40 hidden transition-colors" onclick="window.handleLineClick('player', 'bodyguard')"></div>
                        <div id="player-line-avatar" class="grow flex flex-wrap justify-center items-center content-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-slate-900/40 border border-slate-800/80 transition-colors" onclick="window.handleLineClick('player', 'avatar')"></div>
                    </div>
                    <div class="flex flex-col gap-1 col-span-2 h-full">
                        <div id="player-line-front" class="grow flex flex-wrap justify-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-slate-900/40 border border-slate-800/80 transition-colors" onclick="window.handleLineClick('player', 'front')"></div>
                        <div id="player-line-mid" class="grow flex flex-wrap justify-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-slate-900/40 border border-slate-800/80 hidden transition-colors" onclick="window.handleLineClick('player', 'mid')"></div>
                        <div id="player-line-back" class="grow flex flex-wrap justify-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-slate-900/40 border border-slate-800/80 hidden transition-colors" onclick="window.handleLineClick('player', 'back')"></div>
                        <div id="player-line-sheltered" class="grow flex flex-wrap justify-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-slate-900/40 border border-slate-800/80 hidden transition-colors" onclick="window.handleLineClick('player', 'sheltered')"></div>
                    </div>
                    <div class="flex flex-col gap-1 col-span-1 h-full">
                        <div id="player-line-sideline" class="grow flex flex-wrap justify-center items-center content-center gap-1 min-h-[179px] sm:min-h-[201px] p-1 rounded-lg bg-blue-950/20 border border-blue-900/40 transition-colors" onclick="window.handleLineClick('player', 'sideline')"></div>
                    </div>
                </div>
            </div>
            
            <div class="shrink-0 flex flex-col justify-start" id="player-discard-container"></div>
        </div>
      </div>

      <!-- THE HAND -->
      <div class="flex flex-col gap-1 pt-1 mt-0.5 border-t border-slate-800/60 transition-all duration-300 min-w-[800px]" id="player-hand-wrapper">
        <div class="flex justify-between items-center px-1">
          <span class="text-[10px] font-extrabold uppercase tracking-wider text-amber-400">
            🎴 Hand (<span id="hand-card-count">0</span>)
          </span>
          <span class="text-[9px] text-slate-400 hidden sm:block">Click a card to play or sacrifice</span>
        </div>

        <div id="player-hand-container" class="flex flex-wrap justify-center gap-2 p-1.5 bg-slate-950/80 rounded-lg border border-slate-800/80 min-h-[190px] items-start transition-all duration-300">
          <span class="text-[10px] text-slate-500 italic mx-auto self-center">Your hand is empty.</span>
        </div>
      </div>

    </div>

    <!-- EXTRACTED MODALS & OVERLAYS -->
    <action-log></action-log>
    <harvest-overlay></harvest-overlay>
    <unit-action-modal></unit-action-modal>
    <zone-viewer-modal></zone-viewer-modal>

  </main>

  <script type="module" src="./src/tabletop/index.js"></script>
</body>
</html>
